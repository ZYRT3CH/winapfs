# Builds winapfs.exe on GitHub's machines and publishes it when a version tag
# such as v0.1.0 is pushed, so downloads never come from someone's own PC.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = 'target/release/winapfs.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  winapfs.exe" | Set-Content winapfs.exe.sha256 -Encoding ascii
          gh release create $env:GITHUB_REF_NAME $exe winapfs.exe.sha256 `
            --title "winapfs $env:GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
