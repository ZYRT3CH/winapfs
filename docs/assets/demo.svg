<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Terminal: winapfs write on; plug in the Mac drive; winapfs checks it and mounts it writable at M:; a video is copied onto it and verified.">
  <defs>
    <style>text { white-space: pre; }</style>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <clipPath id="t1"><rect x="40" y="88" height="34" width="0"><animate attributeName="width" values="0;0;880;880;0" keyTimes="0;0.029;0.1;0.95;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t7"><rect x="40" y="292" height="34" width="0"><animate attributeName="width" values="0;0;880;880;0" keyTimes="0;0.457;0.529;0.95;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t8"><rect x="40" y="326" height="34" width="0"><animate attributeName="width" values="0;0;880;880;0" keyTimes="0;0.586;0.657;0.95;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect x="2" y="2" width="956" height="466" rx="20" fill="#0b0e17" stroke="url(#frame)" stroke-width="2.5"/>
  <path d="M22 2h916a20 20 0 0 1 20 20v26H2V22A20 20 0 0 1 22 2z" fill="#151a28"/>
  <circle cx="30" cy="25" r="7" fill="#ff5f57"/>
  <circle cx="54" cy="25" r="7" fill="#febc2e"/>
  <circle cx="78" cy="25" r="7" fill="#28c840"/>
  <text x="480" y="31" text-anchor="middle" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#8b93a8">winapfs</text>

  <g font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="19" xml:space="preserve">
    <!-- 1: command, typed -->
    <text x="40" y="112" clip-path="url(#t1)"><tspan fill="#34d399">PS&gt;</tspan><tspan fill="#f1f5f9"> winapfs write on</tspan></text>
    <!-- 2 -->
    <text x="40" y="146" fill="#c4b5fd" opacity="0">write mode is ON: Mac drives you plug in appear writable
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.129;0.14;0.95;1" dur="14s" repeatCount="indefinite"/></text>
    <!-- 3 -->
    <text x="40" y="180" fill="#64748b" font-style="italic" opacity="0">  # plug in the Mac drive...
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.186;0.197;0.95;1" dur="14s" repeatCount="indefinite"/></text>
    <!-- 4 -->
    <text x="40" y="214" fill="#94a3b8" opacity="0">checking  the free-space map before writing
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.243;0.254;0.95;1" dur="14s" repeatCount="indefinite"/></text>
    <!-- 5 -->
    <text x="40" y="248" opacity="0"><tspan fill="#94a3b8">result    </tspan><tspan fill="#34d399">consistent: nothing in use is marked free ✓</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.314;0.325;0.95;1" dur="14s" repeatCount="indefinite"/></text>
    <!-- 6 -->
    <text x="40" y="282" opacity="0"><tspan fill="#94a3b8">mounted   </tspan><tspan fill="#f1f5f9">disk3 at </tspan><tspan fill="#22d3ee" font-weight="700">M:</tspan><tspan fill="#f1f5f9">, </tspan><tspan fill="#f472b6" font-weight="700">READ-WRITE</tspan><tspan fill="#f1f5f9">, visible in Explorer</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.371;0.382;0.95;1" dur="14s" repeatCount="indefinite"/></text>
    <!-- 7: command, typed -->
    <text x="40" y="316" clip-path="url(#t7)"><tspan fill="#34d399">PS&gt;</tspan><tspan fill="#f1f5f9"> Copy-Item .\Holiday.mov M:\Videos\</tspan></text>
    <!-- 8: command, typed -->
    <text x="40" y="350" clip-path="url(#t8)"><tspan fill="#34d399">PS&gt;</tspan><tspan fill="#f1f5f9"> Get-FileHash M:\Videos\Holiday.mov</tspan></text>
    <!-- 9 -->
    <text x="40" y="384" opacity="0"><tspan fill="#94a3b8">SHA256    9F2C…E41A  </tspan><tspan fill="#34d399">identical to the original ✓</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7;0.711;0.95;1" dur="14s" repeatCount="indefinite"/></text>
    <!-- 10: prompt with a blinking cursor -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.757;0.768;0.95;1" dur="14s" repeatCount="indefinite"/>
      <text x="40" y="418" fill="#34d399">PS&gt;</text>
      <rect x="88" y="401" width="11" height="22" fill="#f1f5f9">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
